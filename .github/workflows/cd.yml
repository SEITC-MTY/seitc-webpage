name: Sync Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add upstream and merge
        run: |
          git remote add upstream https://github.com/seitcMty/seitc-webpage.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || true
          git push origin main
          
